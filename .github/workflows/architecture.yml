name: Architecture Constitution

on:
  pull_request:
  push:
    branches:
      - bridgeline-services-barber-website-factory
      - main
      - master

permissions:
  contents: read

jobs:
  architecture:
    name: Validate architecture constitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run architecture:check
      - run: npm run test:architecture
