name: Template CI

on:
  pull_request:
  push:
    branches:
      - main
      - v0/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate template
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/barber
      # RLS enforcement (Part 8) runs against this same disposable PostgreSQL
      # service, as the role the service actually created. Without these the test
      # tried to connect as "postgres", failed, and reported itself skipped while
      # the job stayed green.
      #   • a schema is copied into a uniquely named scratch database, and two
      #     synthetic tenants are created there, so the run never depends on seed
      #     data or on any shop that happens to exist;
      #   • RLS_TEST_REQUIRED makes an unexecuted security test a failure, because
      #     "did not run" must never look like "passed";
      #   • the runtime role's password is generated per run, so no credential is
      #     stored in the workflow.
      RLS_TEST_HOST: 127.0.0.1
      RLS_TEST_PORT: '5432'
      RLS_TEST_ADMIN_USER: ci
      RLS_TEST_ADMIN_PASSWORD: ci
      RLS_TEST_SOURCE_DB: barber
      RLS_TEST_REQUIRED: 'true'
      NEXTAUTH_SECRET: ci-only-secret-for-build-validation
      NEXTAUTH_URL: http://localhost:3000
      # Explicit build-only URL for static page-data collection. Deployment
      # environments still provide their own NEXT_PUBLIC_APP_URL.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_MODE: production
      RATE_LIMIT_CI_IN_MEMORY: 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: barber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:vercel-build
      - run: npm run test:optional-integrations
      # Production dependency audit: fails the build on any high or critical
      # advisory. Dev-only advisories are excluded (--omit=dev).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run license:inventory
      - run: npm run architecture:check
      # Deployment protection: the newest migration must be backward compatible, so
      # a rollback or a slow rollout still works against the new schema.
      - run: npm run deploy:migration-check
      # Every Prisma model must be classified before RLS could ever be planned.
      - run: npm run rls:plan
      - run: npm run test:architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npx prisma generate
      # Full CI test expansion (Requirement 32): every DB-backed test suite
      # that does NOT require a live Next server runs against the Postgres
      # service. Suites needing a running app + session auth are documented
      # in docs/TESTING.md and run in dev via npm run test:all (test:matrix
      # and friends, 11 suites).
      # psql and pg_dump must exist, and must match the server major version, for
      # the RLS enforcement test (it dumps a schema and restores it). The runner's
      # preinstalled client is a different major version from the 15 server, so
      # this pins 15 from the PostgreSQL apt repository, and falls back to the
      # preinstalled client rather than failing the job if PGDG is unreachable.
      - name: Install PostgreSQL 15 client tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq postgresql-client-15; then
            # The RLS test tolerates a newer client than the server (it drops the
            # settings the server does not accept), so this is not fatal. It is
            # reported as a warning rather than silently claimed as pinned.
            echo "::warning::PGDG did not provide the PostgreSQL 15 client; the runner's own client will be used."
            exit 0
          fi
          # Installing the package is NOT enough to select it: Debian's
          # /usr/bin/psql is pg_wrapper, which runs the newest client installed, so
          # the runner's PostgreSQL 18 kept winning and the "pin" was cosmetic. The
          # bin directory on PATH is what actually picks the version.
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"

      # A separate step, because GITHUB_PATH only affects later steps. Prints what
      # will really run, and says plainly which version was selected.
      - name: Verify the PostgreSQL client matches the server
        run: |
          psql --version && pg_dump --version
          psql_major=$(psql --version | sed -E 's/.* ([0-9]+)\..*/\1/')
          dump_major=$(pg_dump --version | sed -E 's/.* ([0-9]+)\..*/\1/')
          if [ "$psql_major" = "15" ] && [ "$dump_major" = "15" ]; then
            echo "Client matches the PostgreSQL 15 service."
          else
            echo "::warning::Client ${psql_major}/${dump_major} does not match the 15 server; the RLS test drops the settings this server cannot accept, so it still runs."
          fi
      - run: npx prisma migrate deploy
      # The deployed cron configuration must be the one the Vercel plan allows. A Hobby
      # deployment whose vercel.json carries a sub-daily schedule is rejected by Vercel, so
      # this runs before anything expensive and names the file to fix.
      - name: Validate the deployed cron plan
        run: npm run cron:plan --check

      # The Pro plan is verified by its own assertions (the 15-minute schedule and the
      # endpoint's route) rather than by pointing vercel.json at it, because the deployment
      # ships Hobby.
      - name: Cron plan and scheduled-report switch tests
        run: npm run test:cron-plan

      - run: npm run test:ci
      # Pure announcement authorization, audience, and inbox tests need no provider credentials.
      - run: npm run test:announcements
      # Backup reliability gates (reliability hardening, Part 3):
      #   • cleanup runs on every failure path (scratch databases and temp dumps
      #     cannot leak when a restore fails) — tests/backup-failure-modes
      #   • encrypted off-site round trip with read-back verification, plus
      #     retention that refuses to delete the last verified copy
      #   • owner-facing status wording stays free of infrastructure language
      - run: npm run test:backup
      - run: npm run test:operations
      # End-to-end off-site backup against the seeded database: dump -> gzip ->
      # AES-256-GCM -> upload -> read back -> restore into a scratch database ->
      # retention -> recorded history. BACKUP_VERIFY_RESTORE makes the restore
      # part of the run, so a backup is never merely "uploaded" in CI.
      - name: Off-site backup round trip (local storage)
        env:
          BACKUP_STORAGE_DRIVER: localfs
          BACKUP_LOCAL_DIR: ${{ github.workspace }}/offsite-backups
          # 32 bytes, base64. The previous value decoded to 38 bytes, so the rehearsal
          # refused to run at all ("BACKUP_ENCRYPTION_KEY must be 32 bytes"). It is a
          # CI-only throwaway, generated for this purpose and never used anywhere else.
          BACKUP_ENCRYPTION_KEY: 'WGftCuEj3wCTVZi3wCueSxki90L0qzNZIJgqTkv0ods='
          BACKUP_VERIFY_RESTORE: 'true'
        run: |
          set -euo pipefail
          mkdir -p offsite-backups
          npm run db:backup:offsite
          ls -la offsite-backups/database | head -20
          test -n "$(ls -A offsite-backups/database)" || { echo "::error::no backup object was written"; exit 1; }
      - name: Backup freshness watchdog
        env:
          BACKUP_MAX_AGE_HOURS: '30'
        run: npm run db:backup:freshness
      - run: npm run build
      # Owner-registration journey (live-server suite, docs/TESTING.md):
      # boots the REAL production build on :3000 in onboarding mode with a
      # test-only relaxed register rate limit, then races the first-owner
      # registration end to end (exactly one OWNER wins; later registrations
      # are CUSTOMER-only; the dashboard gate redirects properly).
      - name: Owner-registration journey (production build)
        shell: bash
        run: |
          set -euo pipefail
          OWNER_REGISTRATION_MODE=onboarding \
          RATE_LIMIT_REGISTER_MAX=25 \
          RATE_LIMIT_ACCEPT_POST_MAX=15 \
          NEXTAUTH_URL=http://localhost:3000 \
          npx next start -p 3000 > /tmp/next-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          SERVER_READY=false
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              SERVER_READY=true
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$SERVER_READY" != true ]; then
            echo "::error::Production Next.js server did not become healthy within 60 seconds."
            cat /tmp/next-server.log
            exit 1
          fi
          npm run test:owner-registration
          npm run test:coowner-permissions

  # Browser-level E2E (final-audit requirement): real Chromium against the
  # production build. Docs/TESTING.md documents the local equivalent.
  e2e:
    name: E2E browser tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/barber
      # RLS enforcement (Part 8) runs against this same disposable PostgreSQL
      # service, as the role the service actually created. Without these the test
      # tried to connect as "postgres", failed, and reported itself skipped while
      # the job stayed green.
      #   • a schema is copied into a uniquely named scratch database, and two
      #     synthetic tenants are created there, so the run never depends on seed
      #     data or on any shop that happens to exist;
      #   • RLS_TEST_REQUIRED makes an unexecuted security test a failure, because
      #     "did not run" must never look like "passed";
      #   • the runtime role's password is generated per run, so no credential is
      #     stored in the workflow.
      RLS_TEST_HOST: 127.0.0.1
      RLS_TEST_PORT: '5432'
      RLS_TEST_ADMIN_USER: ci
      RLS_TEST_ADMIN_PASSWORD: ci
      RLS_TEST_SOURCE_DB: barber
      RLS_TEST_REQUIRED: 'true'
      NEXTAUTH_SECRET: ci-only-secret-for-build-validation
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Demo-mode seed gives E2E a deterministic owner account, then
      # scripts/e2e-prepare-user.mts pins its password for the specs.
      APP_MODE: demo
      RATE_LIMIT_CI_IN_MEMORY: 'true'
      SEED_ALLOW_DESTRUCTIVE: 'true'
      E2E_OWNER_EMAIL: owner@yourbarbershop.com
      E2E_OWNER_PASSWORD: E2eOwner!Passw0rd
      # The 17-test suite registers several accounts within one minute;
      # keep the register limiter headroom high enough for that burst.
      RATE_LIMIT_REGISTER_MAX: '25'
      # E2E accepts three staff invitations from one IP within a minute.
      RATE_LIMIT_ACCEPT_POST_MAX: '15'
      # The inbound SMS consent suite signs its webhook payloads with this
      # value. A fixed test token, not a credential: it exists so the STOP/START
      # signature path is exercised without a Twilio account.
      TWILIO_AUTH_TOKEN: test-twilio-auth-token
      # The suites below act as several different visitors by sending forwarding
      # headers. Those headers are ignored unless a proxy is trusted, so the test
      # environment opts in explicitly — production relies on Vercel's.
      RATE_LIMIT_TRUST_PROXY: 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: barber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # psql and pg_dump must exist, and must match the server major version, for
      # the RLS enforcement test (it dumps a schema and restores it). The runner's
      # preinstalled client is a different major version from the 15 server, so
      # this pins 15 from the PostgreSQL apt repository, and falls back to the
      # preinstalled client rather than failing the job if PGDG is unreachable.
      - name: Install PostgreSQL 15 client tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq postgresql-client-15; then
            # The RLS test tolerates a newer client than the server (it drops the
            # settings the server does not accept), so this is not fatal. It is
            # reported as a warning rather than silently claimed as pinned.
            echo "::warning::PGDG did not provide the PostgreSQL 15 client; the runner's own client will be used."
            exit 0
          fi
          # Installing the package is NOT enough to select it: Debian's
          # /usr/bin/psql is pg_wrapper, which runs the newest client installed, so
          # the runner's PostgreSQL 18 kept winning and the "pin" was cosmetic. The
          # bin directory on PATH is what actually picks the version.
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"

      # A separate step, because GITHUB_PATH only affects later steps. Prints what
      # will really run, and says plainly which version was selected.
      - name: Verify the PostgreSQL client matches the server
        run: |
          psql --version && pg_dump --version
          psql_major=$(psql --version | sed -E 's/.* ([0-9]+)\..*/\1/')
          dump_major=$(pg_dump --version | sed -E 's/.* ([0-9]+)\..*/\1/')
          if [ "$psql_major" = "15" ] && [ "$dump_major" = "15" ]; then
            echo "Client matches the PostgreSQL 15 service."
          else
            echo "::warning::Client ${psql_major}/${dump_major} does not match the 15 server; the RLS test drops the settings this server cannot accept, so it still runs."
          fi
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run db:seed
      # Backup/restore verification needs pg_dump + psql, which GitHub's
      # runners provide and the sandbox's bundled postgres does not. Runs right
      # after the seed so there is real data to dump and restore.
      - name: Backup and restore verification
        run: npm run db:backup-verify
      - run: npx tsx scripts/e2e-prepare-user.mts
      - run: npm run build
      # playwright.config.ts webServer boots `npm run start` itself.
      - run: npm run test:e2e
      # Server-dependent assertions that the unit job cannot run (they drive the
      # real HTTP surface, so they need a live server and a migrated database).
      # Playwright's webServer has exited by now, so boot the same production
      # build and wait for health before asserting. These two suites guard
      # notification logging resilience and the website draft/publish contract
      # (including co-owner publication denial).
      - name: Server-dependent regression suites
        run: |
          npm run start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { tail -50 /tmp/server.log; exit 1; }
          npx tsx tests/notification-resilience.test.ts
          npx tsx tests/website-publish.test.ts
          npx tsx tests/two-factor-enrollment.test.ts
          npx tsx tests/two-factor-api.test.ts
      # The full chain, not just the suites above: every database-backed
      # regression test runs here, so a green build means all of them pass. The
      # sign-in throttle is widened in CI-local mode only — otherwise a run that
      # signs in dozens of times from one IP would trip the production cap.
      - name: Full database regression chain (test:all)
        run: npm run test:all
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
