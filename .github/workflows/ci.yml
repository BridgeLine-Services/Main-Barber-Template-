name: Template CI

on:
  pull_request:
  push:
    branches:
      - main
      - v0/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate template
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/barber
      NEXTAUTH_SECRET: ci-only-secret-for-build-validation
      NEXTAUTH_URL: http://localhost:3000
      # Explicit build-only URL for static page-data collection. Deployment
      # environments still provide their own NEXT_PUBLIC_APP_URL.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_MODE: production
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: barber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:vercel-build
      - run: npm run test:optional-integrations
      # Production dependency audit: fails the build on any critical
      # advisory. Dev-only advisories are excluded (--omit=dev).
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run architecture:check
      - run: npm run test:architecture
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma validate
      - run: npx prisma generate
      # Full CI test expansion (Requirement 32): every DB-backed test suite
      # that does NOT require a live Next server runs against the Postgres
      # service. Suites needing a running app + session auth are documented
      # in docs/TESTING.md and run in dev via npm run test:all (test:matrix
      # and friends, 11 suites).
      - run: npx prisma migrate deploy
      - run: npm run test:ci
      - run: npm run build
      # Owner-registration journey (live-server suite, docs/TESTING.md):
      # boots the REAL production build on :3000 in onboarding mode with a
      # test-only relaxed register rate limit, then races the first-owner
      # registration end to end (exactly one OWNER wins; later registrations
      # are CUSTOMER-only; the dashboard gate redirects properly).
      - name: Owner-registration journey (production build)
        shell: bash
        run: |
          set -euo pipefail
          OWNER_REGISTRATION_MODE=onboarding \
          RATE_LIMIT_REGISTER_MAX=25 \
          RATE_LIMIT_ACCEPT_POST_MAX=15 \
          NEXTAUTH_URL=http://localhost:3000 \
          npx next start -p 3000 > /tmp/next-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          SERVER_READY=false
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              SERVER_READY=true
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$SERVER_READY" != true ]; then
            echo "::error::Production Next.js server did not become healthy within 60 seconds."
            cat /tmp/next-server.log
            exit 1
          fi
          npm run test:owner-registration
          npm run test:coowner-permissions

  # Browser-level E2E (final-audit requirement): real Chromium against the
  # production build. Docs/TESTING.md documents the local equivalent.
  e2e:
    name: E2E browser tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/barber
      NEXTAUTH_SECRET: ci-only-secret-for-build-validation
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Demo-mode seed gives E2E a deterministic owner account, then
      # scripts/e2e-prepare-user.mts pins its password for the specs.
      APP_MODE: demo
      SEED_ALLOW_DESTRUCTIVE: 'true'
      E2E_OWNER_EMAIL: owner@yourbarbershop.com
      E2E_OWNER_PASSWORD: E2eOwner!Passw0rd
      # The 17-test suite registers several accounts within one minute;
      # keep the register limiter headroom high enough for that burst.
      RATE_LIMIT_REGISTER_MAX: '25'
      # E2E accepts three staff invitations from one IP within a minute.
      RATE_LIMIT_ACCEPT_POST_MAX: '15'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: barber
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run db:seed
      - run: npx tsx scripts/e2e-prepare-user.mts
      - run: npm run build
      # playwright.config.ts webServer boots `npm run start` itself.
      - run: npm run test:e2e
