<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="92" fill="#1a1a1a"/>
  <defs>
    <pattern id="stripes" width="92" height="92" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="31" height="92" fill="#d4af37"/>
      <rect x="31" width="31" height="92" fill="#f5f5f5"/>
    </pattern>
    <clipPath id="band"><rect x="140" y="140" width="232" height="232" rx="10"/></clipPath>
  </defs>
  <rect x="140" y="140" width="232" height="232" rx="10" fill="url(#stripes)" clip-path="url(#band)"/>
</svg>
